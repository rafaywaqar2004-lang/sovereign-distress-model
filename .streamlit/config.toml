[theme]
# A distinct visual identity for this tool, not a shared palette with its
# two siblings. MENASA (near-black + gold, Inter/Newsreader) and the Gulf
# Tracker (cream + navy, Public Sans/Source Serif 4) already occupy those
# looks -- this app had drifted into borrowing pieces of both (MENASA's
# dark ground, Gulf's navy accent and font stack), per direct user
# feedback that it read as a mashup rather than its own thing. This is a
# "quant terminal" identity instead: teal primary + coral secondary (a
# color family neither sibling uses), and the IBM Plex family throughout
# (Sans for headings/body, Mono for data) with no literary serif heading
# font -- appropriate for a tool whose actual content is live model
# output and coefficients, not an editorial brief.
base = "dark"
primaryColor = "#33B6AF"
backgroundColor = "#0A1211"
secondaryBackgroundColor = "#0F1B19"
textColor = "#F0EFEA"
borderColor = "#233531"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseRadius = "0.4rem"
showWidgetBorder = true

[client]
# Hides Streamlit Cloud's own "Deploy"/Fork/GitHub/hamburger-menu chrome on
# top of the app -- that's platform UI injected outside app.py, not app
# branding.
toolbarMode = "minimal"
