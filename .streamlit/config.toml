[theme]
# A genuine blend of both sibling tools, not a clone of either: Gulf
# Tracker's light, warm, cream palette and readable Public Sans/Source
# Serif 4 fonts (chosen there for readability), MENASA's navy-blue accent
# swapped in as this app's primary (Gulf's own accent color), and a touch
# of the portfolio's own gold (Crescent Brief) as a secondary highlight —
# tying this flagship visually to all three siblings instead of picking
# one look outright.
base = "light"
primaryColor = "#2463A5"
backgroundColor = "#F7F4EE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17202A"
borderColor = "#D7D5CB"
font = "sans serif"
headingFont = "serif"
codeFont = "monospace"
baseRadius = "0.4rem"
showWidgetBorder = true

[client]
# Hides Streamlit Cloud's own "Deploy"/Fork/GitHub/hamburger-menu chrome on
# top of the app -- that's platform UI injected outside app.py, not app
# branding.
toolbarMode = "minimal"
