[theme]
# Dark navy/charcoal base per direct user request, keeping the same navy
# accent family this app has used throughout (from MENASA's own primary),
# brightened from #2463A5 to #4A90D9 so it clears WCAG AA contrast against
# a near-black ground (verified: 5.8:1 on the page background, 5.2:1 on
# card surfaces -- the original hex only cleared ~3:1 on dark). Public
# Sans/Source Serif 4/IBM Plex Mono fonts kept from the earlier light
# pass -- only the color scheme changed, not the type system.
base = "dark"
primaryColor = "#4A90D9"
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#131A24"
textColor = "#F0EFEA"
borderColor = "#2A3542"
font = "sans serif"
headingFont = "serif"
codeFont = "monospace"
baseRadius = "0.4rem"
showWidgetBorder = true

[client]
# Hides Streamlit Cloud's own "Deploy"/Fork/GitHub/hamburger-menu chrome on
# top of the app -- that's platform UI injected outside app.py, not app
# branding.
toolbarMode = "minimal"
