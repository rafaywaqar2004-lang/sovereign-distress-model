name: Fetch top export/import commodity categories (UN Comtrade)

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Optional: comma-separated country codes to restrict this run to (diagnostic use). Leave blank for the full real fetch.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandas
        run: pip install pandas

      - name: Fetch trade commodity breakdown
        working-directory: data
        env:
          PYTHONUNBUFFERED: "1"
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          FETCH_TRADE_COMMODITIES_COUNTRIES: ${{ inputs.countries }}
        timeout-minutes: 45
        run: python -u fetch_trade_commodities.py

      - name: Commit fetched data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trade_commodities.csv
          git diff --staged --quiet && echo "No data changes" && exit 0
          git commit -m "Fetch real top export/import commodity categories (UN Comtrade)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
