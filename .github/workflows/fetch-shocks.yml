name: Fetch geopolitical shock timelines (Phase 2)

on:
  workflow_dispatch: {}   # Run manually from the Actions tab -- no schedule yet
                          # until the fetch script's output is validated for real

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch GDELT shock timelines
        working-directory: shock-module
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 60
        run: python -u fetch_shocks.py

      - name: Commit fetched timelines if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shock-module/shock_timelines_raw.json
          git diff --staged --quiet && echo "No data changes" && exit 0
          git commit -m "Fetch GDELT shock timelines"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
