name: Fetch country equity ETF signals (real, test-and-keep)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch country equity signals
        working-directory: forecast-module
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 10
        run: python -u fetch_country_equity_signals.py

      - name: Commit fetched data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast-module/country_equity_signals.json
          git diff --staged --quiet && echo "No data changes" && exit 0
          git commit -m "Fetch real country equity ETF signals"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
