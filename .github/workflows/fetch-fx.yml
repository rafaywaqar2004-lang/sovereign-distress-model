name: Fetch historical FX rates around shock events (Phase 2)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Frankfurter FX rates
        working-directory: shock-module
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 10
        run: python -u fetch_fx.py

      - name: Commit fetched FX data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shock-module/fx_timelines_raw.json
          git diff --staged --quiet && echo "No data changes" || git commit -m "Fetch historical FX rates around shock events"
          git push
