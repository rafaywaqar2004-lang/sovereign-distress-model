name: Diagnose FX data sources (Phase 2, one-shot)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yfinance
        run: pip install yfinance

      - name: Test yfinance for the 5 shock-event currency pairs
        working-directory: shock-module
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 5
        run: python -u diagnose_yfinance.py
