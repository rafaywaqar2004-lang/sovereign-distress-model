name: Fetch real displacement data (UNHCR)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandas
        run: pip install pandas

      - name: Fetch displacement data
        working-directory: data
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 20
        run: python -u fetch_displacement.py

      - name: Commit fetched data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/displacement.csv
          git diff --staged --quiet && echo "No data changes" && exit 0
          git commit -m "Fetch real displacement data (UNHCR)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
