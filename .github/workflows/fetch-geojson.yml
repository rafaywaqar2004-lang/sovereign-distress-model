name: Fetch country boundary polygons for the coverage map

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and trim Natural Earth country polygons
        working-directory: map-data
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 5
        run: python -u fetch_geojson.py

      - name: Commit fetched geojson if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add map-data/countries.geojson
          git diff --staged --quiet && echo "No data changes" || git commit -m "Fetch country boundary polygons for the coverage map (Natural Earth)"
          git push
