name: Fetch global financial conditions — VIX, US 10Y, DXY, EM bond ETF

on:
  workflow_dispatch: {}
  schedule:
    # 06:00 UTC, Tuesday-Saturday -- a few hours after US markets close,
    # so VIX/10Y/DXY/EM bond ETF reflect the prior session's final values.
    - cron: "0 6 * * 2-6"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch global financial conditions
        working-directory: forecast-module
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 5
        run: python -u fetch_global_conditions.py

      - name: Commit fetched data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast-module/global_conditions.json
          git diff --staged --quiet && echo "No data changes" || git commit -m "Fetch global financial conditions (VIX, US 10Y, DXY, EM bond ETF)"
          git push
